    <!--
      COMO ADICIONAR UM TRABALHO
      Copie um <figure class="piece"> da seção certa e troque:
        - o <div class="piece__ph" ...></div> por <img src="img/personal/arquivo.jpg" alt="Descrição" loading="lazy">
          (a imagem aparece inteira, no formato dela: não precisa cortar)
        - data-title, data-year e data-tech: aparecem quando a imagem é ampliada
        - o texto do <figcaption>
    -->

    <section class="personal-section" id="illustration">
      <div class="container">
        <header class="block__head">
